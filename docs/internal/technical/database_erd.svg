<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <style>
      .bg{fill:#f7f8fa}.title{font:700 34px Arial,sans-serif;fill:#18212b}.sub{font:18px Arial,sans-serif;fill:#52606d}
      .group{font:700 19px Arial,sans-serif}.old-label{fill:#245b78}.new-label{fill:#9a4f16}
      .box{fill:#fff;stroke-width:2}.old{stroke:#4384a8}.new{stroke:#d47b35}.head-old{fill:#32779d}.head-new{fill:#c76925}
      .name{font:700 19px Arial,sans-serif;fill:#fff}.col{font:15px Consolas,"Courier New",monospace;fill:#263442}.muted{fill:#697886}
      .rel{fill:none;stroke:#52606d;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:8 6}
      .legend{font:16px Arial,sans-serif;fill:#3d4b58}.note{fill:#fff;stroke:#c9d1d9;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1320"/>
  <text class="title" x="55" y="58">MichiDoro unified SQLite schema - version 5</text>
  <text class="sub" x="55" y="90">One offline database: michifocus.sqlite. Solid links are owned relations; dashed links are nullable historical associations.</text>

  <text class="group old-label" x="55" y="140">Existing product data (schemas 1-4)</text>
  <text class="group new-label" x="1030" y="140">Routine data added in schema 5</text>

  <!-- Relationships are drawn behind the tables. -->
  <path class="rel optional" d="M360 230 H320"/>
  <path class="rel optional" d="M660 250 H620"/>
  <path class="rel optional" d="M660 300 H620"/>
  <path class="rel optional" d="M500 450 V370"/>
  <path class="rel optional" d="M800 450 V370"/>
  <path class="rel optional" d="M740 450 C740 390 460 410 460 370"/>
  <path class="rel" d="M1370 225 H1290"/>
  <path class="rel" d="M1030 505 C970 505 970 300 1290 300"/>
  <path class="rel optional" d="M1030 610 C940 610 940 330 320 330"/>
  <path class="rel optional" d="M1370 535 H1290"/>
  <path class="rel" d="M1390 800 V730"/>
  <path class="rel optional" d="M1270 800 C1130 760 1130 730 1160 730"/>
  <path class="rel optional" d="M1200 920 C900 920 900 300 620 300"/>

  <!-- Existing tables -->
  <g transform="translate(55 170)">
    <rect class="box old" width="265" height="200" rx="6"/><rect class="head-old" width="265" height="48" rx="5"/>
    <text class="name" x="18" y="31">goals</text>
    <text class="col" x="18" y="78">PK id</text><text class="col" x="18" y="104">title</text>
    <text class="col" x="18" y="130">target_sessions</text><text class="col" x="18" y="156">completed_sessions</text>
    <text class="col muted" x="18" y="182">target_date?</text>
  </g>
  <g transform="translate(360 170)">
    <rect class="box old" width="260" height="200" rx="6"/><rect class="head-old" width="260" height="48" rx="5"/>
    <text class="name" x="18" y="31">tasks</text>
    <text class="col" x="18" y="78">PK id</text><text class="col" x="18" y="104">title, status</text>
    <text class="col muted" x="18" y="130">FK goal_id?</text><text class="col muted" x="18" y="156">scheduled_date?</text>
    <text class="col muted" x="18" y="182">duration_minutes?</text>
  </g>
  <g transform="translate(660 170)">
    <rect class="box old" width="300" height="200" rx="6"/><rect class="head-old" width="300" height="48" rx="5"/>
    <text class="name" x="18" y="31">pomodoro_sessions</text>
    <text class="col" x="18" y="78">PK id</text><text class="col muted" x="18" y="104">FK goal_id?, task_id?</text>
    <text class="col" x="18" y="130">started_at, ended_at</text><text class="col" x="18" y="156">focused_seconds, status</text>
    <text class="col muted" x="18" y="182">mood / distraction fields</text>
  </g>
  <g transform="translate(55 450)">
    <rect class="box old" width="265" height="145" rx="6"/><rect class="head-old" width="265" height="48" rx="5"/>
    <text class="name" x="18" y="31">reporting_metadata</text>
    <text class="col" x="18" y="80">PK id</text><text class="col" x="18" y="110">completion_tracking_started_at</text>
  </g>
  <g transform="translate(360 450)">
    <rect class="box old" width="260" height="175" rx="6"/><rect class="head-old" width="260" height="48" rx="5"/>
    <text class="name" x="18" y="31">task_completion_events</text>
    <text class="col" x="18" y="80">PK id</text><text class="col muted" x="18" y="106">FK task_id?</text>
    <text class="col" x="18" y="132">task_id_snapshot</text><text class="col" x="18" y="158">completed_at</text>
  </g>
  <g transform="translate(660 450)">
    <rect class="box old" width="300" height="230" rx="6"/><rect class="head-old" width="300" height="48" rx="5"/>
    <text class="name" x="18" y="31">pomodoro_runtime</text>
    <text class="col" x="18" y="80">PK id (singleton)</text><text class="col muted" x="18" y="106">FK task_id?, goal_id?</text>
    <text class="col" x="18" y="132">phase, is_running</text><text class="col" x="18" y="158">remaining_seconds</text>
    <text class="col" x="18" y="184">cadence / block plan</text><text class="col muted" x="18" y="210">recovery timestamps</text>
  </g>
  <g transform="translate(55 720)">
    <rect class="box old" width="265" height="160" rx="6"/><rect class="head-old" width="265" height="48" rx="5"/>
    <text class="name" x="18" y="31">calendar_events</text>
    <text class="col" x="18" y="80">PK id</text><text class="col" x="18" y="106">title, scheduled_at</text>
    <text class="col" x="18" y="132">duration_minutes</text>
  </g>

  <!-- Routine tables -->
  <g transform="translate(1030 170)">
    <rect class="box new" width="260" height="200" rx="6"/><rect class="head-new" width="260" height="48" rx="5"/>
    <text class="name" x="18" y="31">routines</text>
    <text class="col" x="18" y="78">PK id</text><text class="col" x="18" y="104">name, description?</text>
    <text class="col" x="18" y="130">icon_key, color_key</text><text class="col" x="18" y="156">status, paused_until?</text>
    <text class="col muted" x="18" y="182">archived_at?</text>
  </g>
  <g transform="translate(1370 170)">
    <rect class="box new" width="280" height="155" rx="6"/><rect class="head-new" width="280" height="48" rx="5"/>
    <text class="name" x="18" y="31">routine_days</text>
    <text class="col" x="18" y="80">PK/FK routine_id</text><text class="col" x="18" y="108">PK weekday (1..7)</text>
    <text class="col muted" x="18" y="136">CASCADE with template</text>
  </g>
  <g transform="translate(1030 470)">
    <rect class="box new" width="260" height="260" rx="6"/><rect class="head-new" width="260" height="48" rx="5"/>
    <text class="name" x="18" y="31">routine_items</text>
    <text class="col" x="18" y="78">PK id</text><text class="col" x="18" y="104">FK routine_id</text>
    <text class="col muted" x="18" y="130">FK goal_id?</text><text class="col" x="18" y="156">position, title</text>
    <text class="col" x="18" y="182">scheduled_minute</text><text class="col" x="18" y="208">duration_minutes</text>
    <text class="col muted" x="18" y="234">reminder / Pomodoro prefs</text>
  </g>
  <g transform="translate(1370 470)">
    <rect class="box new" width="330" height="260" rx="6"/><rect class="head-new" width="330" height="48" rx="5"/>
    <text class="name" x="18" y="31">routine_runs</text>
    <text class="col" x="18" y="78">PK id</text><text class="col muted" x="18" y="104">FK routine_id?</text>
    <text class="col" x="18" y="130">source_routine_id + local_date</text><text class="col" x="18" y="156">status</text>
    <text class="col" x="18" y="182">name / icon / color snapshots</text><text class="col" x="18" y="208">scheduled_start snapshot</text>
    <text class="col muted" x="18" y="234">actual status timestamps</text>
  </g>
  <g transform="translate(1200 800)">
    <rect class="box new" width="500" height="285" rx="6"/><rect class="head-new" width="500" height="48" rx="5"/>
    <text class="name" x="18" y="31">routine_item_runs</text>
    <text class="col" x="18" y="78">PK id; FK routine_run_id</text><text class="col muted" x="18" y="104">FK routine_item_id?; FK task_id?</text>
    <text class="col" x="18" y="130">source_item_id; task_id_snapshot?</text><text class="col" x="18" y="156">position / title / schedule snapshots</text>
    <text class="col" x="18" y="182">duration / goal / optional snapshots</text><text class="col" x="18" y="208">reminder / Pomodoro snapshots</text>
    <text class="col" x="18" y="234">status and actual timestamps</text><text class="col muted" x="18" y="262">UNIQUE run+source item and generated task</text>
  </g>

  <rect class="note" x="55" y="1135" width="1645" height="125" rx="6"/>
  <rect x="82" y="1165" width="28" height="20" fill="#32779d"/><text class="legend" x="122" y="1181">Existing tables preserved by the v4 to v5 migration</text>
  <rect x="620" y="1165" width="28" height="20" fill="#c76925"/><text class="legend" x="660" y="1181">Routine tables created in schema 5</text>
  <text class="legend" x="82" y="1220">Historical snapshots survive template, item, goal, or task deletion. Settings remain in JSON and are not part of SQLite export.</text>
  <text class="legend" x="82" y="1247">Export and import use the complete michifocus.sqlite database as one file; no separate routine or per-table files are created.</text>
</svg>
